  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (s, a, b) => clamp((s - a) / (b - a));
  const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
  const fadeW = (s, a, b) => Math.min(seg(s, a, a + .5), 1 - seg(s, b - .4, b));

  const logo = new Image();
  logo.src = LOGO_SRC;

  function line(x1, y1, x2, y2, c, w = 3, al = 1) {
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
  }
  function arrow(x1, y1, x2, y2, c, w = 8, al = 1) {
    line(x1, y1, x2, y2, c, w, al);
    const a = Math.atan2(y2 - y1, x2 - x1), L = 26;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - L*Math.cos(a - .45), y2 - L*Math.sin(a - .45));
    ctx.lineTo(x2 - L*Math.cos(a + .45), y2 - L*Math.sin(a + .45));
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function txt(str, x, y, size, c, wt = 500, align = 'center', al = 1) {
    if (al <= 0) return;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = c;
    ctx.font = `${wt} ${size}px Jost, system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y); ctx.restore();
  }
  function atom(x, y, r, fill, label, tc) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
    txt(label, x, y + 2, r * .9, tc, 600);
  }
  function spring(x1, y1, x2, y2, c, coils = 8, amp = 24) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, lead = L * .12, n = coils * 2;
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 8; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + ux*lead, y1 + uy*lead);
    for (let i = 1; i < n; i++) {
      const f = lead + (L - 2*lead) * i / n, sg = (i % 2 ? 1 : -1) * amp;
      ctx.lineTo(x1 + ux*f + nx*sg, y1 + uy*f + ny*sg);
    }
    ctx.lineTo(x2 - ux*lead, y2 - uy*lead); ctx.lineTo(x2, y2);
    ctx.stroke(); ctx.restore();
  }
  function drawLogo(cx, cy, w, al) {
    if (!logo.complete || !logo.naturalWidth || al <= 0) return;
    const h = w * logo.naturalHeight / logo.naturalWidth;
    ctx.save(); ctx.globalAlpha = al;
    ctx.drawImage(logo, cx - w/2, cy - h/2, w, h); ctx.restore();
  }
  // Transmittance model (1 = no absorption). Representative peaks for an organic sample.
  const PEAKS = [[3350,.55,90],[2960,.22,22],[2925,.35,24],[2855,.20,20],
                 [1715,.72,22],[1460,.18,18],[1240,.30,30],[1050,.45,35]];
  function T(n) {
    let a = 0;
    for (const [c, d, w] of PEAKS) a += d * Math.exp(-(((n - c) / w) ** 2));
    return 1 - Math.min(a, .95);
  }
  // Interferogram: centre burst at zero path difference, decaying fringes.
  function ifg(x0, x1, yc, amp, u, c, w) {
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round';
    ctx.beginPath(); const N = 400;
    for (let i = 0; i <= N * u; i++) {
      const d = -1 + 2 * i / N;
      const y = yc - amp * Math.exp(-((d / .3) ** 2)) * Math.cos(2 * Math.PI * 7 * d);
      const x = x0 + (d + 1) / 2 * (x1 - x0);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke(); ctx.restore();
  }
  // Spectrum trace, wavenumber axis reversed (4000 left -> 400 right).
  function spec(x0, x1, yTop, hgt, nmax, c, w) {
    ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineJoin = 'round';
    ctx.beginPath(); let first = true;
    for (let n = 4000; n >= nmax; n -= 4) {
      const x = x0 + (4000 - n) / 3600 * (x1 - x0);
      const y = yTop + (1 - T(n)) * hgt;
      first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false;
    }
    ctx.stroke(); ctx.restore();
  }
  const sx = (n, x0, x1) => x0 + (4000 - n) / 3600 * (x1 - x0);

  // ---------- scenes (layout in 1080 x 1920 reel space) ----------

  // 0-6 s: hook
  function scene1(s) {
    const amp = 40 + 40 * seg(s, 0, 1.5);
    const reveal = W * seg(s, 0, 1.2);
    ctx.save(); ctx.strokeStyle = BLUE; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let x = 0; x <= reveal; x += 4) {
      const u = x / W * 4 * Math.PI;
      const y = 1480 + amp * Math.sin(u * 2 - s * 5) * (.6 + .4 * Math.sin(u * .5 + s));
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke(); ctx.restore();
    txt('Every molecule is', W/2, 700, 84, INK, 600, 'center', fadeW(s, .4, 3.4));
    txt('constantly vibrating.', W/2, 800, 84, INK, 600, 'center', fadeW(s, .4, 3.4));
    txt('FTIR', W/2, 980, 260, BLUE, 700, 'center', fadeW(s, 3.6, 6));
    txt('Fourier Transform', W/2, 1110, 60, INK, 500, 'center', fadeW(s, 3.6, 6));
    txt('Infrared Spectroscopy', W/2, 1180, 60, INK, 500, 'center', fadeW(s, 3.6, 6));
  }

  // 6-14 s: bonds stretch, then bend (scene-local s: 0-8)
  function scene2(s) {
    const cx = W/2;
    if (s < 4) {
      const L = 360 + 56 * Math.sin(2 * Math.PI * 1.2 * s);
      const y = 1040, x1 = cx - L/2, x2 = cx + L/2;
      spring(x1, y, x2, y, INK, 8, 36);
      atom(x1, y, 100, BLUE, 'C', ICE);
      atom(x2, y, 84, INK, 'O', ICE);
      txt('Stretching', cx, 640, 110, INK, 600, 'center', fadeW(s, 0, 4));
      txt('Two atoms, one bond,', cx, 790, 48, INK, 500, 'center', fadeW(s, .3, 3.8));
      txt('moving like a spring', cx, 850, 48, INK, 500, 'center', fadeW(s, .3, 3.8));
    } else {
      const b = 14 * Math.sin(2 * Math.PI * 1.2 * (s - 4));
      const ox = cx, oy = 1060, R = 300;
      const a1 = (-90 - 52 - b) * Math.PI / 180, a2 = (-90 + 52 + b) * Math.PI / 180;
      const h1 = [ox + R*Math.cos(a1), oy + R*Math.sin(a1)];
      const h2 = [ox + R*Math.cos(a2), oy + R*Math.sin(a2)];
      spring(ox, oy, h1[0], h1[1], INK, 6, 28);
      spring(ox, oy, h2[0], h2[1], INK, 6, 28);
      atom(ox, oy, 96, INK, 'O', ICE);
      atom(h1[0], h1[1], 56, BLUE, 'H', ICE);
      atom(h2[0], h2[1], 56, BLUE, 'H', ICE);
      txt('Bending', cx, 640, 110, INK, 600, 'center', fadeW(s, 4, 8));
      txt('The bond angle opens', cx, 790, 48, INK, 500, 'center', fadeW(s, 4.3, 7.8));
      txt('and closes', cx, 850, 48, INK, 500, 'center', fadeW(s, 4.3, 7.8));
    }
  }

  // 14-26 s: interferometer and interferogram
  function scene3(s) {
    const mx = 840 + 40 * Math.sin(2 * Math.PI * .35 * s);
    line(120, 760, 500, 760, BLUE, 8, .9);          // source beam
    line(540, 760, 540, 575, BLUE, 5, .55);          // to fixed mirror
    line(540, 760, mx, 760, BLUE, 5, .55);           // to moving mirror
    line(540, 760, 540, 930, BLUE, 5, .55);          // to detector
    line(480, 700, 600, 820, BLUE, 16, 1);           // beam splitter
    line(500, 560, 580, 560, INK, 14, 1);            // fixed mirror
    line(mx, 680, mx, 840, INK, 14, 1);              // moving mirror
    ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.strokeRect(510, 930, 60, 44); ctx.restore();
    const ph = (s * .6) % 1;
    ctx.save(); ctx.fillStyle = BLUE; ctx.beginPath();
    ctx.arc(120 + (mx - 120) * ph, 760, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    txt('IR source', 120, 700, 38, INK, 500, 'left');
    txt('Beam splitter', 640, 880, 38, INK, 500, 'left');
    txt('Fixed mirror', 620, 540, 38, INK, 500, 'left');
    txt('Moving mirror', mx, 630, 38, INK, 500, 'center');
    txt('Detector', 540, 1010, 38, INK, 500, 'center');
    // interferogram
    const u = ease(seg(s, 1.5, 10));
    line(90, 1420, 990, 1420, BLUE, 3);
    ifg(90, 990, 1420, 120, u, INK, 5);
    txt('Interferogram', 90, 1300, 50, INK, 600, 'left', fadeW(s, 1, 12));
    txt('Mirror displacement →', 990, 1300, 36, BLUE, 500, 'right', fadeW(s, 1, 12));
  }

  // 26-36 s: Fourier transform, interferogram to spectrum
  function scene4(s) {
    txt('Interferogram', W/2, 560, 60, INK, 600, 'center', fadeW(s, 0, 10));
    line(90, 800, 990, 800, BLUE, 3, .8);
    ifg(90, 990, 800, 130, 1, INK, 5);
    arrow(W/2, 900, W/2, 985, BLUE, 10);
    txt('Fourier transform', W/2, 1040, 40, BLUE, 600, 'center', fadeW(s, .5, 10));
    txt('Spectrum', W/2, 1100, 60, INK, 600, 'center', fadeW(s, 1, 10));
    const nmax = 4000 - 3600 * ease(seg(s, 1.2, 7));
    line(90, 1160, 990, 1160, BLUE, 2, .5);
    line(90, 1440, 990, 1440, BLUE, 3, fadeW(s, 1, 10));
    [[4000,'4000'],[3000,'3000'],[2000,'2000'],[1000,'1000'],[400,'400']].forEach(([n, l]) => {
      const x = sx(n, 90, 990);
      line(x, 1440, x, 1452, BLUE, 3, fadeW(s, 1, 10));
      txt(l, x, 1490, 34, INK, 500, 'center', fadeW(s, 1, 10));
    });
    spec(90, 990, 1160, 260, nmax, INK, 5);
    txt('Wavenumber (cm−1)', W/2, 1550, 36, BLUE, 500, 'center', fadeW(s, 1, 10));
  }

  // 36-48 s: annotated spectrum
  function scene5(s) {
    const x0 = 90, x1 = 990, yTop = 800, hgt = 520, yAx = 1340;
    const prog = ease(seg(s, 0, 1.2));
    const fpA = seg(s, 5.5, 6.5) * .25;
    ctx.save(); ctx.fillStyle = ICE; ctx.globalAlpha = fpA;
    ctx.fillRect(sx(1500, x0, x1), yTop - 10, sx(400, x0, x1) - sx(1500, x0, x1), yAx - yTop + 10);
    ctx.restore();
    line(x0, yTop, x1, yTop, BLUE, 2, .5);
    line(x0, yAx, x1, yAx, BLUE, 3);
    [[4000,'4000'],[3000,'3000'],[2000,'2000'],[1000,'1000']].forEach(([n, l]) => {
      const x = sx(n, x0, x1);
      line(x, yAx, x, yAx + 12, BLUE, 3);
      txt(l, x, yAx + 36, 34, INK, 500, 'center', .9);
    });
    txt('Wavenumber (cm−1)', W/2, yAx + 90, 36, BLUE, 500, 'center', .9);
    spec(x0, x1, yTop, hgt, 4000 - 3600 * prog, BLUE, 6);
    const labels = [
      [3350, 'O–H stretch', '~3300 cm−1, broad', 250, 560, 37.0],
      [2930, 'C–H stretch', '2850–2960 cm−1',   430, 680, 38.5],
      [1715, 'C=O stretch', '~1715 cm−1, strong', 690, 560, 40.0],
      [1050, 'Fingerprint',  'below 1500 cm−1',   860, 680, 42.0],
    ];
    labels.forEach(([n, name, sub, lx, ly, ap]) => {
      const al = seg(s, ap, ap + .6) * (1 - seg(s, 46.6, 47.4));
      const px = sx(n, x0, x1), py = yTop + (1 - T(n)) * hgt;
      line(lx, ly + 60, px, py - 14, INK, 2.5, .7 * al);
      txt(name, lx, ly, 42, INK, 600, 'center', al);
      txt(sub, lx, ly + 44, 30, INK, 500, 'center', .8 * al);
    });
  }

  // 48-60 s: recap, then closing card (logo in pill, screenshot layout)
  function scene6(s) {
    const steps = ['Vibrations', 'Interferogram', 'Spectrum', 'Molecular identity'];
    const fadeOut = 1 - seg(s, 4.4, 5.0);
    steps.forEach((t, i) => {
      const y = 740 + i * 150;
      const al = seg(s, .5 + i * 1.1, .5 + i * 1.1 + .6) * fadeOut;
      txt(t, W/2, y, 64, INK, 600, 'center', al);
      if (i < steps.length - 1) arrow(W/2, y + 40, W/2, y + 110, BLUE, 6, al);
    });
    // closing card: layout taken from closing_template.html (1080x1920)
    const a1 = seg(s, 5.0, 5.8);
    if (logo.complete && logo.naturalWidth && a1 > 0) {
      ctx.save(); ctx.globalAlpha = a1;
      ctx.drawImage(logo, 60, 390, 520, 520 * logo.naturalHeight / logo.naturalWidth);
      ctx.restore();
    }
    txt('Keep Exploring Science', 60, 800, 66, INK, 700, 'left', a1);
    txt('With VierApparatus', 60, 879, 66, INK, 700, 'left', a1);
    ctx.save(); ctx.globalAlpha = a1; ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(683, 890, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    const a2 = seg(s, 5.8, 6.6);
    ctx.save(); ctx.globalAlpha = a2; ctx.fillStyle = ICE;
    ctx.beginPath(); ctx.roundRect(60, 1030, 670, 140, 70); ctx.fill(); ctx.restore();
    txt('vierapparatus.com', 130, 1095, 59, BLUE, 700, 'left', a2);
  }

  // ---------- transitions: blue wipes ----------
  function wipes(s) {
    for (const B of [6, 14, 26, 36, 48]) {
      const d = s - B;
      ctx.save(); ctx.fillStyle = BLUE;
      if (d > -.4 && d < 0) ctx.fillRect(0, 0, W * (d + .4) / .4, H);
      else if (d >= 0 && d < .4) { const x = W * d / .4; ctx.fillRect(x, 0, W - x, H); }
      ctx.restore();
    }
  }

  // ---------- subtitles (narration text), wrapped, reels-safe ----------
  const SUBS = [
    [0, 5.5, 'Every molecule is constantly vibrating.'],
    [6, 10, 'Bonds stretch and bend like tiny springs.'],
    [10, 14, 'Each vibration has a characteristic frequency.'],
    [14.5, 20.5, 'FTIR passes infrared light through an interferometer, where one mirror moves.'],
    [20.5, 26, 'The detector records an interferogram: a pattern of light and dark fringes.'],
    [26, 31.5, 'A Fourier transform converts that pattern into a spectrum.'],
    [31.5, 36, 'Each frequency the sample absorbs appears as a dip.'],
    [36.5, 42.5, 'An O–H stretch near 3300 wavenumbers points to O–H groups, such as in alcohols or water.'],
    [42.5, 48, 'A carbonyl peak near 1715 flags C=O groups.'],
    [48.5, 54, 'The fingerprint region below 1500 helps identify the exact molecule.'],
    [54, 60, 'FTIR: a molecular fingerprint in seconds.'],
  ];
  function wrap(str, maxW, size, wt) {
    ctx.font = `${wt} ${size}px Jost, system-ui, sans-serif`;
    const words = str.split(' '), out = []; let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) out.push(cur);
    return out;
  }
  function subtitle(s) {
    const cur = SUBS.find(([a, b]) => s >= a && s < b);
    if (!cur) return;
    const [a, b, text] = cur;
    const al = Math.min(seg(s, a, a + .3), 1 - seg(s, b - .3, b));
    if (al <= 0) return;
    const size = 40, lh = 56;
    const lines = wrap(text, 860, size, 500);
    ctx.font = `500 ${size}px Jost, system-ui, sans-serif`;
    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 56;
    const bh = lines.length * lh + 28;
    const cy = 1640 - bh / 2 + lh / 2;
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.roundRect(W/2 - bw/2, 1640 - bh/2, bw, bh, 22); ctx.fill(); ctx.restore();
    lines.forEach((l, i) => txt(l, W/2, cy + i * lh, size, WHITE, 500, 'center', al));
  }

  // ---------- main draw ----------
  function draw(t) {
    const s = t / 1000;
    ctx.fillStyle = WHITE; ctx.fillRect(0, 0, W, H);
    if (s < 6) scene1(s);
    else if (s < 14) scene2(s - 6);
    else if (s < 26) scene3(s - 14);
    else if (s < 36) scene4(s - 26);
    else if (s < 48) scene5(s - 36);
    else scene6(Math.min(s - 48, 12));
    wipes(s);
    if (s < 60) subtitle(s);
  }

  // ---------- playback, narration, controls ----------
  let start = null, running = false, voiceOn = false, timers = [];
  const voiceBtn = document.getElementById('voice');
  const replayBtn = document.getElementById('replay');

  function clearSpeech() {
    timers.forEach(clearTimeout); timers = [];
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }
  function scheduleSpeech() {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    SUBS.forEach(([a, , text]) => {
      timers.push(setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = .95;
        speechSynthesis.speak(u);
      }, a * 1000));
    });
  }
  function frame(now) {
    let t = now - start;
    if (t >= DUR) { t = DUR; running = false; }
    draw(t);
    bar.style.width = (t / DUR * 100) + '%';
    if (running) requestAnimationFrame(frame);
  }
  function play() {
    clearSpeech();
    start = performance.now(); running = true;
    scheduleSpeech();
    requestAnimationFrame(frame);
  }

  voiceBtn.addEventListener('click', () => {
    if (!('speechSynthesis' in window)) { voiceBtn.textContent = 'Narration unavailable'; return; }
    voiceOn = !voiceOn;
    voiceBtn.textContent = 'Narration: ' + (voiceOn ? 'on' : 'off');
    if (!voiceOn) clearSpeech();
  });
  replayBtn.addEventListener('click', play);

  // Wait for the Jost font and the logo image, then start.
  const fontReady = document.fonts && document.fonts.load
    ? document.fonts.load('600 40px Jost').catch(() => {})
    : Promise.resolve();
  const logoReady = new Promise(res => {
    if (logo.complete && logo.naturalWidth) res();
    else { logo.onload = res; logo.onerror = res; }
  });
  Promise.all([fontReady, logoReady]).then(() => { draw(0); play(); });
})();
</script>
</body>
</html>
